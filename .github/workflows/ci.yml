name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o go-task-cli .

      - name: End-to-end smoke test
        run: |
          export GO_TASK_CLI_FILE="$PWD/tasks.json"
          ./go-task-cli add "Ship it" --project work --priority high --due 2026-12-01
          ./go-task-cli add "Buy milk"
          ./go-task-cli list --project work
          ./go-task-cli done 1
          ./go-task-cli csv-export out.csv
          ./go-task-cli csv-import out.csv
          ./go-task-cli stats
          ./go-task-cli version

      - name: Check the HTML board
        run: |
          export GO_TASK_CLI_FILE="$PWD/examples/tasks.json"
          ./go-task-cli board > board.html
          grep -q '<!DOCTYPE html>' board.html
          grep -q 'Cut v1.1.0 release notes' board.html
          grep -q '12 tasks across 8 projects' board.html
          # The board must work offline: no scripts, no external requests.
          ! grep -q '<script' board.html
          ! grep -qE '(<link|<img|src="http)' board.html
